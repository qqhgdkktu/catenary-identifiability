name: Verify the classification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Check the local classification and exact examples
        run: python3 verify.py --fetch --require-classification
      - name: Check proved global multiplicity statements and rational certificates
        run: python3 global-multiplicity/verify_global.py --fetch
      - name: Check elimination-rate certificates with two exact methods
        run: |
          python3 -m venv "$RUNNER_TEMP/catenary-certificates"
          py="$RUNNER_TEMP/catenary-certificates/bin/python"
          "$py" -m pip install sympy==1.14.0
          "$py" global-multiplicity/verification/verify_preterminal.py
          "$py" global-multiplicity/verification/independent_preterminal_audit.py
      - name: Check the third output and the inverse solver in exact arithmetic
        run: |
          py="$RUNNER_TEMP/catenary-certificates/bin/python"
          "$py" global-multiplicity/verification/verify_reconstruction.py
          "$py" global-multiplicity/verification/verify_third_sensor.py
          "$py" global-multiplicity/verification/verify_seven_collision.py
          "$py" global-multiplicity/verification/verify_exceptional_blocks.py
